[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polygraph"
dynamic = ["version"]
description = "A lie detector for AI chatbots: trap questions, an AI judge and a report card."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Christian Fortezzo" }]
dependencies = [
    # The live server (Session 8): FastAPI streams runs to the dashboard, Uvicorn serves it.
    "fastapi>=0.162",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
polygraph = "polygraph.cli:main"

[tool.setuptools.dynamic]
version = { attr = "polygraph.__version__" }

[tool.setuptools.packages.find]
include = ["polygraph*"]

[tool.setuptools.package-data]
# The labeling page for `polygraph label`.
"polygraph.judgecheck" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests talk to real models, so they only run when asked: python -m pytest -m live
addopts = "-m 'not live'"
# Starlette 1.10 suggests a newer HTTP library for its test client; httpx works fine.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = ["live: asks a real model (Ollama, or a cloud model if its key is in .env)"]
