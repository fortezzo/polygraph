# The automatic checks (Session 10). On every push to main and every pull
# request, GitHub runs Polygraph's offline tests and the dashboard's checks, on
# Linux. Nothing here uses an API key: the tests that ask real models only run
# on Christian's PC (python -m pytest -m live).
#
# Each action is pinned to the exact commit of a release that had been out for
# at least two weeks, like the dashboard's packages (dashboard/.npmrc).

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install Polygraph, with the package versions from Christian's PC
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Run the offline tests
        run: python -m pytest
      - name: Look for API keys and other secrets
        run: python scripts/scan_secrets.py --ci

  dashboard:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install exactly the locked packages (their install scripts stay off)
        run: npm ci --no-audit --no-fund
      - name: Check the packages' registry signatures
        run: npm audit signatures
      - name: Type check, tests and build
        run: npm run check
      - name: Build the demo site
        run: npm run build:demo
